<head>

  <title>Assinatura</title>
</head>
<link rel="stylesheet" href="index.css">
<body>

  <div id="orientation-block">
    <p>🔄 Gire o celular para usar a aplicação</p>
  </div>

  <div id="app">
    
    <div id = 'header'>
      <h1>Folha de garantia | Assinatura do cliente: </h1>
      <p>Ao assinar, o ciente declara que está de acordo com os termos da garantia BH</p>

    <div id="actions">

  <script src="websocket.js"></script>
